<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f7fb">
<title>中3 国語文法</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===== トップ画面 ===== -->
<main id="homeView" class="home app">
  <header class="home-header">
    <div>
      <div class="eyebrow">京都府公立高校入試対策・単一HTML修正版</div>
      <h1>中3 国語文法</h1>
    </div>
    <button id="settingsBtnHome" class="settings-link" aria-label="詳細設定">
      <span class="gear">⚙</span><span>詳細設定</span>
    </button>
  </header>

  <div style="text-align:center;font-size:11px;color:#747080;margin-top:4px">v5・文法資料内蔵・敬語再設計</div>
  <section class="home-summary">
    <div class="summary-main">
      <span>全747問</span>
      <span id="homeAnswered">完了 0</span>
      <span id="homeWrong">できなかった 0</span>
    </div>
    <div class="home-filter-row">
      <label>
        学習する問題
        <select id="homeResultFilter">
          <option value="">すべて</option>
          <option value="unanswered">未回答だけ</option>
          <option value="wrong">できなかった問題だけ</option>
          <option value="correct">できただけ</option>
        </select>
      </label>
      <label>
        難易度
        <select id="homeDifficultyFilter">
          <option value="">すべて</option>
          <option value="基礎">基礎</option>
          <option value="標準">標準</option>
          <option value="入試">入試</option>
        </select>
      </label>
    </div>
  </section>

  <h2 class="choose-title">分野を選んでください</h2>

  <section id="categoryGrid" class="category-grid"></section>

  <div class="home-bottom-actions">
    <button id="grammarReferenceBtn" class="reference-btn">📘 文法資料</button>
    <button id="allQuestionsBtn" class="all-questions-btn">すべての問題から出題</button>
  </div>
</main>


<!-- ===== 文法資料 ===== -->
<main id="referenceView" class="app reference hidden">
  <header class="reference-header">
    <button id="referenceHomeBtn" class="back-home">⌂ トップ</button>
    <div class="reference-title-wrap">
      <div class="eyebrow">講義・復習用</div>
      <h1>文法資料</h1>
    </div>
    <div class="reference-spacer"></div>
  </header>

  <section class="reference-intro">
    分類・意味・代表例・見分け方をまとめた講義用資料です。
  </section>

  <nav id="referenceCategoryNav" class="reference-nav"></nav>
  <section id="referenceContent" class="reference-content"></section>
</main>

<!-- ===== 問題画面 ===== -->
<main id="quizView" class="app quiz hidden">
  <header class="quiz-header">
    <button id="homeBtn" class="back-home">⌂ トップ</button>
    <div class="quiz-title-wrap">
      <div class="eyebrow">京都府公立高校入試対策・単一HTML修正版</div>
      <h1>中3 国語文法</h1>
    </div>
    <button id="settingsBtnQuiz" class="settings-link" aria-label="詳細設定">
      <span class="gear">⚙</span><span>詳細設定</span>
    </button>
  </header>

  <section class="status">
    <span id="progress">1 / 747</span>
    <span id="meta">基礎 ・ 文・文節・単語</span>
  </section>

  <section class="mini-progress">
    <span id="doneCount">できた 0</span>
    <span id="wrongCount">できなかった 0</span>
    <span id="unansweredCount">未回答 747</span>
  </section>

  <section class="card question-card">
    <div id="questionId" class="qid">GQ00001</div>
    <div id="question" class="question"></div>
  </section>

  <section class="write-card">
    <div class="write-head">
      <span id="writeLabel">ここに書く</span>
      <button id="clearBtn" class="textbtn">消す</button>
    </div>
    <div class="pad-wrap">
      <div id="templateText" class="template-text hidden"></div>
      <canvas id="pad" aria-label="手書き回答欄"></canvas>
    </div>
  </section>

  <section id="answerCard" class="card answer-card hidden">
    <div class="answer-label">答え</div>
    <div id="answer" class="answer"></div>
    <div id="explanation" class="explanation"></div>
    <div class="judge-actions">
      <button id="correctBtn" class="judge correct">✓ できた</button>
      <button id="wrongBtn" class="judge wrong">✕ できなかった</button>
    </div>
    <div id="judgeState" class="judge-state"></div>
  </section>

  <section class="actions">
    <button id="prevBtn" class="secondary">← 前へ</button>
    <button id="answerBtn" class="primary">答えを見る</button>
    <button id="nextBtn" class="secondary">次へ →</button>
  </section>
</main>

<!-- ===== 詳細設定 ===== -->
<dialog id="settings">
  <form method="dialog" class="settings-panel">
    <div class="settings-title">
      <h2>詳細設定</h2>
      <button class="iconbtn" value="cancel" aria-label="閉じる">×</button>
    </div>

    <label>細分類
      <select id="majorFilter"><option value="">すべて</option></select>
    </label>

    <label>京都重要度
      <select id="priorityFilter">
        <option value="">すべて</option>
        <option value="A">Aのみ</option>
        <option value="B">Bのみ</option>
        <option value="C">Cのみ</option>
      </select>
    </label>

    <label class="checkrow">
      <input id="shuffleToggle" type="checkbox">
      <span>ランダム順で出題</span>
    </label>

    <div class="progress-title">分類別進捗</div>
    <div id="categoryProgress" class="category-progress"></div>

    <div class="settings-actions">
      <button id="resetProgressBtn" type="button" class="danger">学習記録をリセット</button>
      <button id="applyBtn" value="default" class="primary">適用</button>
    </div>
  </form>
</dialog>
<script src="data.js"></script>
<script src="lecture-data.js"></script>
<script src="app.js"></script>
</body>
</html>
